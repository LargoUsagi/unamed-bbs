name: CI

on:
  push:
    branches: [master]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'       # Matches 1.0.0
      - '[0-9]+.[0-9]+.[0-9]+-*'     # Matches 1.0.0-alpha.1, 2.1.0-beta, etc.
      - '[0-9]*.[0-9]*.[0-9]*-*'     # Matches 0.0.1-rc.1, 1.0.0-beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: zig build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Pre-populate SQLite amalgamation cache
        run: |
          HASH="N-V-__8AAH-mpwB7g3MnqYU-ooUBF1t99RP27dZ9addtMVXD"
          CACHE_DIR="zig-pkg/$HASH"
          mkdir -p "$CACHE_DIR"
          curl --retry 5 --retry-delay 10 --retry-connrefused \
            -sSL "https://www.sqlite.org/2025/sqlite-amalgamation-3490200.zip" \
            -o sqlite.zip
          unzip -q sqlite.zip
          cp -r sqlite-amalgamation-3490200/* "$CACHE_DIR/"
          rm -rf sqlite.zip sqlite-amalgamation-3490200
      - run: zig build test

  release:
    name: goreleaser snapshot
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Pre-populate SQLite amalgamation cache
        run: |
          HASH="N-V-__8AAH-mpwB7g3MnqYU-ooUBF1t99RP27dZ9addtMVXD"
          CACHE_DIR="zig-pkg/$HASH"
          mkdir -p "$CACHE_DIR"
          curl --retry 5 --retry-delay 10 --retry-connrefused \
            -sSL "https://www.sqlite.org/2025/sqlite-amalgamation-3490200.zip" \
            -o sqlite.zip
          unzip -q sqlite.zip
          cp -r sqlite-amalgamation-3490200/* "$CACHE_DIR/"
          rm -rf sqlite.zip sqlite-amalgamation-3490200
      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
      - name: Run GoReleaser
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            goreleaser release --clean
          else
            goreleaser release --snapshot --clean --skip=before
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
