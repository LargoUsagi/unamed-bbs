name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: zig build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Pre-fetch SQLite Archive
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p ${{ runner.temp }}
          for i in {1..3}; do
            echo "Pre-fetching SQLite (Attempt $i)..."
            zig fetch https://www.sqlite.org/2025/sqlite-amalgamation-3490200.zip && break || sleep 5
            if [ $i -eq 3 ]; then exit 1; fi
          done
      - run: zig build test

  release:
    name: goreleaser snapshot
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Pre-fetch SQLite Archive
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p ${{ runner.temp }}
          for i in {1..3}; do
            echo "Pre-fetching SQLite (Attempt $i)..."
            zig fetch https://www.sqlite.org/2025/sqlite-amalgamation-3490200.zip && break || sleep 5
            if [ $i -eq 3 ]; then exit 1; fi
          done
      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
      - run: goreleaser release --snapshot --clean --skip=before
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
