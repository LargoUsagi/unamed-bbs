name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: zig build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Pre-populate SQLite amalgamation cache
        run: |
          HASH="N-V-__8AAH-mpwB7g3MnqYU-ooUBF1t99RP27dZ9addtMVXD"
          CACHE_DIR="zig-pkg/$HASH"
          mkdir -p "$CACHE_DIR"
          curl --retry 5 --retry-delay 10 --retry-connrefused \
            -sSL "https://www.sqlite.org/2025/sqlite-amalgamation-3490200.zip" \
            -o sqlite.zip
          unzip -q sqlite.zip
          cp -r sqlite-amalgamation-3490200/* "$CACHE_DIR/"
          rm -rf sqlite.zip sqlite-amalgamation-3490200
      - run: zig build test

  release:
    name: goreleaser snapshot
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Pre-populate SQLite amalgamation cache
        run: |
          HASH="N-V-__8AAH-mpwB7g3MnqYU-ooUBF1t99RP27dZ9addtMVXD"
          CACHE_DIR="zig-pkg/$HASH"
          mkdir -p "$CACHE_DIR"
          curl --retry 5 --retry-delay 10 --retry-connrefused \
            -sSL "https://www.sqlite.org/2025/sqlite-amalgamation-3490200.zip" \
            -o sqlite.zip
          unzip -q sqlite.zip
          cp -r sqlite-amalgamation-3490200/* "$CACHE_DIR/"
          rm -rf sqlite.zip sqlite-amalgamation-3490200
      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
      - run: goreleaser release --snapshot --clean --skip=before
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
